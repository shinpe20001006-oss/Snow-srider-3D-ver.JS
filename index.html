<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow Rider 3D - Online Multiplayer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #cce0ff; font-family: 'Arial Black', sans-serif; user-select: none; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #menu-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 23, 42, 0.85); padding: 30px; border-radius: 16px; color: white; text-align: center; pointer-events: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #38bdf8; }
        input { padding: 12px; font-size: 16px; border-radius: 8px; border: none; margin: 8px 0; width: 220px; text-align: center; font-weight: bold; }
        button { padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; background: #38bdf8; color: #0f172a; margin: 5px; transition: 0.2s; }
        button:hover { background: #7dd3fc; transform: scale(1.05); }
        #hud { position: absolute; top: 20px; left: 20px; color: white; font-size: 28px; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); display: none; }
        #leaderboard { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.6); color: white; padding: 15px; border-radius: 10px; min-width: 180px; display: none; }
        #crash-banner { position: absolute; top: 30%; width: 100%; text-align: center; color: #ef4444; font-size: 48px; font-weight: 900; text-shadow: 3px 3px 0 #000; display: none; }
        .player-label { position: absolute; color: white; background: rgba(0,0,0,0.7); padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; pointer-events: none; transform: translate(-50%, -100%); border: 1px solid #38bdf8; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="ui-layer">
        <div id="hud">距離: <span id="dist-val">0</span> m</div>
        <div id="leaderboard">
            <div style="border-bottom: 2px solid #555; padding-bottom:5px; margin-bottom:5px;">🏆 順位表</div>
            <div id="player-list"></div>
        </div>
        <div id="crash-banner">💥 クラッシュ！<br><span style="font-size:20px; color:white;">画面クリックで他プレイヤーを観戦</span></div>

        <div id="menu-box">
            <h1 style="margin-top:0; color:#38bdf8; font-size:32px;">❄️ SNOW RIDER 3D</h1>
            <input type="text" id="p-name" placeholder="名前を入力" value="Rider"><br>
            <input type="text" id="p-room" placeholder="部屋コード (例: 777)"><br>
            <button id="btn-create">部屋を作成</button>
            <button id="btn-enter">部屋に参加</button>
            <div id="status-msg" style="margin-top:10px; font-size:13px; color:#94a3b8;">部屋コードを入力してスタート</div>
        </div>
    </div>

    <script>
        // --- サウンド生成器 (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const t = audioCtx.currentTime;

            if (type === 'jump') {
                osc.frequency.setValueAtTime(150, t);
                osc.frequency.exponentialRampToValueAtTime(400, t + 0.15);
                gain.gain.setValueAtTime(0.3, t);
                gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
                osc.start(t); osc.stop(t + 0.15);
            } else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, t);
                osc.frequency.linearRampToValueAtTime(30, t + 0.4);
                gain.gain.setValueAtTime(0.5, t);
                gain.gain.linearRampToValueAtTime(0.01, t + 0.4);
                osc.start(t); osc.stop(t + 0.4);
            }
        }

        // --- ゲームエンジン基本変数 ---
        let scene, camera, renderer;
        let player, sledMesh, playerSpeed = 1.0, isAlive = true, isPlaying = false;
        let pY = 0, vY = 0, isGrounded = true, rollAngle = 0;
        let obstacles = [], otherPlayers = {}, connections = [], peer;
        let isHost = false, mapSeed = 100, spectateIdx = 0;
        let snowParticles;

        const keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; if(e.code === 'Space') e.preventDefault(); });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        function seededRandom() {
            let x = Math.sin(mapSeed++) * 10000;
            return x - Math.floor(x);
        }

        // --- 3Dモデルビルダー (ソリ・木・雪だるま) ---
        function buildSled(isGhost = false) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({
                color: isGhost ? 0x00a8ff : 0xd63031,
                transparent: isGhost,
                opacity: isGhost ? 0.45 : 1.0,
                roughness: 0.3
            });
            const metalMat = new THREE.MeshStandardMaterial({ color: 0x2d3436, metalness: 0.8 });

            // ソリの土台
            const base = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.15, 2.4), mat);
            base.position.y = 0.4;
            group.add(base);

            // スキー板（左右）
            for (let side of [-0.6, 0.6]) {
                const runner = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.1, 2.8), metalMat);
                runner.position.set(side, 0.1, -0.2);
                group.add(runner);
            }
            return group;
        }

        function createTree(x, z) {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 2, 6), new THREE.MeshStandardMaterial({color: 0x4a2f13}));
            trunk.position.y = 1;
            group.add(trunk);

            const greenMat = new THREE.MeshStandardMaterial({color: 0x1e4620, roughness: 0.9});
            for (let i = 0; i < 3; i++) {
                const leaves = new THREE.Mesh(new THREE.ConeGeometry(2.2 - i*0.4, 2.5, 6), greenMat);
                leaves.position.y = 2.5 + i * 1.3;
                group.add(leaves);
            }
            group.position.set(x, 0, z);
            return group;
        }

        function createSnowman(x, z) {
            const group = new THREE.Group();
            const snowMat = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.5});
            const b1 = new THREE.Mesh(new THREE.SphereGeometry(1.2, 8, 8), snowMat); b1.position.y = 1.0;
            const b2 = new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 8), snowMat); b2.position.y = 2.4;
            group.add(b1, b2);
            group.position.set(x, 0, z);
            return group;
        }

        // --- シーン構築 ---
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xa0c4ff);
            scene.fog = new THREE.FogExp2(0xa0c4ff, 0.008);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(30, 60, 20);
            sun.castShadow = true;
            scene.add(sun);
            scene.add(new THREE.AmbientLight(0xddeeff, 0.7));

            // 地面（雪山）
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(120, 6000),
                new THREE.MeshStandardMaterial({ color: 0xf0f8ff, roughness: 0.8 })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.position.z = -3000;
            scene.add(ground);

            // 吹雪エフェクト (パーティクル)
            const snowGeo = new THREE.BufferGeometry();
            const snowCount = 1500;
            const posArray = new Float32Array(snowCount * 3);
            for(let i=0; i<snowCount*3; i+=3) {
                posArray[i] = (Math.random() - 0.5) * 80;
                posArray[i+1] = Math.random() * 20;
                posArray[i+2] = (Math.random() - 0.5) * 80;
            }
            snowGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            snowParticles = new THREE.Points(snowGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.2}));
            scene.add(snowParticles);

            player = new THREE.Group();
            sledMesh = buildSled(false);
            player.add(sledMesh);
            scene.add(player);
        }

        // --- コース生成 ---
        function buildCourse(seedVal) {
            mapSeed = seedVal;
            obstacles.forEach(o => scene.remove(o.mesh));
            obstacles = [];

            for (let z = -40; z > -5000; z -= 14) {
                const x = (seededRandom() - 0.5) * 60;
                const type = seededRandom();
                let mesh, radius;

                if (type < 0.6) {
                    mesh = createTree(x, z); radius = 1.3;
                } else if (type < 0.85) {
                    mesh = createSnowman(x, z); radius = 1.4;
                } else {
                    mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(1.6), new THREE.MeshStandardMaterial({color: 0x57606f}));
                    mesh.position.set(x, 1.2, z);
                    radius = 1.6;
                }
                scene.add(mesh);
                obstacles.push({ mesh, x, z, radius });
            }
        }

        // --- 他プレイヤー管理 ---
        function createGhost(id, name) {
            const group = new THREE.Group();
            group.add(buildSled(true));
            scene.add(group);

            const label = document.createElement('div');
            label.className = 'player-label';
            label.innerText = name;
            document.body.appendChild(label);

            otherPlayers[id] = { group, label, name, isAlive: true, score: 0 };
        }

        // --- メインループ ---
        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                if (isAlive) {
                    // 横移動 & 傾きアニメーション
                    let moveX = 0;
                    if (keys['ArrowLeft'] || keys['KeyA']) { moveX -= 0.45; rollAngle = 0.35; }
                    else if (keys['ArrowRight'] || keys['KeyD']) { moveX += 0.45; rollAngle = -0.35; }
                    else { rollAngle *= 0.85; }

                    player.position.x += moveX;
                    player.position.x = Math.max(-28, Math.min(28, player.position.x));
                    sledMesh.rotation.z = rollAngle;

                    // ジャンプ物理演算
                    if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && isGrounded) {
                        vY = 0.35;
                        isGrounded = false;
                        playSound('jump');
                    }
                    pY += vY;
                    vY -= 0.018; // 重力
                    if (pY <= 0) { pY = 0; vY = 0; isGrounded = true; }
                    player.position.y = pY;

                    // 前進 & 加速
                    player.position.z -= playerSpeed;
                    playerSpeed = Math.min(2.5, playerSpeed + 0.00015);

                    const currentDist = Math.floor(-player.position.z);
                    document.getElementById('dist-val').innerText = currentDist;

                    // カメラ追従
                    camera.position.set(player.position.x * 0.7, player.position.y + 4.5, player.position.z + 8.5);
                    camera.lookAt(player.position.x, player.position.y + 1, player.position.z - 10);

                    // 衝突判定 (ジャンプ中は判定を回避可能)
                    if (pY < 1.2) {
                        for (let obs of obstacles) {
                            const dx = player.position.x - obs.x;
                            const dz = player.position.z - obs.z;
                            if (Math.hypot(dx, dz) < obs.radius) {
                                isAlive = false;
                                playSound('crash');
                                document.getElementById('crash-banner').style.display = 'block';
                                broadcast({ type: 'crash', score: currentDist });
                                break;
                            }
                        }
                    }

                    broadcast({
                        type: 'pos',
                        x: player.position.x, y: player.position.y, z: player.position.z,
                        rz: sledMesh.rotation.z, score: currentDist
                    });

                } else {
                    // 観戦モード
                    const aliveIds = Object.keys(otherPlayers).filter(id => otherPlayers[id].isAlive);
                    if (aliveIds.length > 0) {
                        const target = otherPlayers[aliveIds[spectateIdx % aliveIds.length]].group;
                        camera.position.set(target.position.x, target.position.y + 5, target.position.z + 9);
                        camera.lookAt(target.position.x, target.position.y + 1, target.position.z - 10);
                    }
                }

                // 吹雪をプレイヤーの周りに移動
                snowParticles.position.set(camera.position.x, 0, camera.position.z - 20);
            }

            // ネームタグ描画同期
            for (let id in otherPlayers) {
                const p = otherPlayers[id];
                if (!p.isAlive) continue;
                const pos = p.group.position.clone().setY(2.2);
                pos.project(camera);
                if (pos.z < 1) {
                    p.label.style.display = 'block';
                    p.label.style.left = `${(pos.x + 1) * window.innerWidth / 2}px`;
                    p.label.style.top = `${(-pos.y + 1) * window.innerHeight / 2}px`;
                } else { p.label.style.display = 'none'; }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('click', () => { if (!isAlive) spectateIdx++; });

        // --- 通信処理 ---
        function setupNetwork(isHosting, roomCode) {
            const peerId = isHosting ? "snowrider-" + roomCode : null;
            peer = new Peer(peerId);

            peer.on('open', () => {
                document.getElementById('status-msg').innerText = isHosting ? "部屋を作成！他プレイヤーの参加待ち..." : "接続成功！";
                if (isHosting) {
                    const seed = Math.floor(Math.random() * 100000);
                    buildCourse(seed);
                    startMatch();
                }
            });

            peer.on('connection', conn => {
                connections.push(conn);
                conn.on('data', d => handleNetData(d, conn.peer));
                setTimeout(() => conn.send({ type: 'start', seed: mapSeed }), 600);
            });
        }

        function handleNetData(data, senderId) {
            if (data.type === 'start') {
                buildCourse(data.seed);
                startMatch();
            } else if (data.type === 'pos') {
                if (!otherPlayers[senderId]) createGhost(senderId, data.name || "Rider");
                otherPlayers[senderId].group.position.set(data.x, data.y, data.z);
                otherPlayers[senderId].group.children[0].rotation.z = data.rz;
                otherPlayers[senderId].score = data.score;
                refreshLeaderboard();
            } else if (data.type === 'crash') {
                if (otherPlayers[senderId]) {
                    otherPlayers[senderId].isAlive = false;
                    otherPlayers[senderId].label.style.display = 'none';
                    scene.remove(otherPlayers[senderId].group);
                }
                refreshLeaderboard();
            }
        }

        function broadcast(msg) {
            msg.name = document.getElementById('p-name').value;
            connections.forEach(c => c.send(msg));
        }

        function refreshLeaderboard() {
            let all = [{ name: document.getElementById('p-name').value + " (自分)", score: isAlive ? Math.floor(-player.position.z) : 0, alive: isAlive }];
            for (let id in otherPlayers) all.push({ name: otherPlayers[id].name, score: otherPlayers[id].score, alive: otherPlayers[id].isAlive });
            all.sort((a,b) => b.score - a.score);
            document.getElementById('player-list').innerHTML = all.map(p => `<div style="margin:3px 0;">${p.alive ? '🟢' : '💀'} ${p.name}: <b>${p.score}m</b></div>`).join('');
        }

        function startMatch() {
            document.getElementById('menu-box').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('leaderboard').style.display = 'block';
            isPlaying = true;
        }

        // ボタン
        document.getElementById('btn-create').onclick = () => {
            const r = document.getElementById('p-room').value;
            if(!r) return alert("部屋コードを入力してください");
            isHost = true;
            setupNetwork(true, r);
        };

        document.getElementById('btn-enter').onclick = () => {
            const r = document.getElementById('p-room').value;
            if(!r) return alert("部屋コードを入力してください");
            setupNetwork(false, r);
            peer.on('open', () => {
                const conn = peer.connect("snowrider-" + r);
                connections.push(conn);
                conn.on('data', d => handleNetData(d, conn.peer));
            });
        };

        initScene();
        animate();
    </script>
</body>
</html>
